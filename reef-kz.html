<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050b14">
<title>KZ 滴定機記錄 | 海水小幫手</title>
<style>
:root{--bg:#050b14;--panel:#0c1626;--line:#1b2c44;--cyan:#00f3ff;--txt:#dbe9ff;--dim:#7e93b3;--pink:#ff5fa2;--green:#3dffb0;}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1a2e,var(--bg));color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px;}
header{text-align:center;padding:18px 0 10px;}
header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 28px rgba(0,243,255,.5);}
header p{margin:6px 0 0;color:var(--dim);font-size:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.card h2{margin:0 0 12px;font-size:16px;color:var(--cyan);text-shadow:0 0 10px rgba(0,243,255,.4);}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:700;}
input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#08111f;color:var(--txt);outline:none;}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.18);}
.btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:900;color:#04121f;cursor:pointer;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 18px rgba(0,243,255,.45);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none;}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6;}
.logitem{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:13px;background:#08111f;}
.logitem .del{float:right;color:var(--pink);font-size:12px;cursor:pointer;font-weight:700;margin-left:8px;}
.logitem .edit{float:right;color:var(--cyan);font-size:12px;cursor:pointer;font-weight:700;margin-right:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💧 KZ 滴定機記錄</h1>
    <p>獨立頁面 · 完整記錄功能 · 不影響主網頁資料</p>
  </header>
  <div class="card">
    <h2>📋 新增記錄</h2>
    <label>日期</label>
    <div class="row" style="gap:6px"><select id="kzYear"></select><select id="kzMonth"></select><select id="kzDay"></select></div>
    <label>KZ Bak 滴速</label>
    <select id="kzBak"><option value="">-- 選擇 --</option></select>
    <label>Kz Sp 滴速</label>
    <select id="kzSp"><option value="">-- 選擇 --</option></select>
    <label>Kz S3 劑量</label>
    <select id="kzS3"><option value="">-- 選擇 --</option></select>
    <label>備註</label>
    <input id="kzNote" type="text" placeholder="例如 換水前測量 / 調整滴速">
    <button class="btn" onclick="kzSave()">存一筆 KZ 記錄</button>
  </div>
  <div class="card">
    <h2>📜 記錄列表</h2>
    <button class="btn ghost" onclick="kzClear()">清空全部</button>
    <div id="kzLog"></div>
  </div>
</div>
<script>
const KZ_KEY = 'kz_log_v1';
function kzLoad(){try{return JSON.parse(localStorage.getItem(KZ_KEY)||'[]');}catch(e){return[];}}
function kzSaveData(a){try{localStorage.setItem(KZ_KEY,JSON.stringify(a));}catch(e){}}
function kzNewId(){return Date.now().toString(36)+Math.random().toString(36).substr(2);}
function kzSave(){
  try{
    const y=document.getElementById('kzYear')?document.getElementById('kzYear').value:'';
    const m=document.getElementById('kzMonth')?document.getElementById('kzMonth').value:'';
    const d=document.getElementById('kzDay')?document.getElementById('kzDay').value:'';
    const dateVal = (y&&m&&d)?(y+'-'+m+'-'+d):new Date().toISOString().slice(0,10);
    const rec={
      d:dateVal,
      bak:document.getElementById('kzBak')?document.getElementById('kzBak').value:'',
      sp:document.getElementById('kzSp')?document.getElementById('kzSp').value:'',
      s3:document.getElementById('kzS3')?document.getElementById('kzS3').value:'',
      note:document.getElementById('kzNote')?document.getElementById('kzNote').value:''
    };
    if(!rec.bak&&!rec.sp&&!rec.s3){alert('至少選一項滴定數值');return;}
    const a=kzLoad();
    rec.id=kzNewId();
    rec.t=Date.now();
    a.unshift(rec);
    kzSaveData(a);
    kzRender();
    document.getElementById('kzBak').value='';
    document.getElementById('kzSp').value='';
    document.getElementById('kzS3').value='';
    document.getElementById('kzNote').value='';
    alert('已儲存 KZ 記錄（共 '+a.length+' 筆，獨立於主網頁）');
  }catch(e){console.error('kzSave error:',e);alert('儲存失敗：'+e.message);}
}
function kzRender(){
  const a=kzLoad();
  const box=document.getElementById('kzLog');
  if(!box)return;
  if(!a.length){box.innerHTML='<div style="font-size:12px;color:var(--dim);padding:10px;">還沒有 KZ 記錄</div>';return;}
  box.innerHTML=a.map((r,i)=>{
    const parts=[];
    if(r.bak)parts.push('Bak:'+r.bak+'滴');
    if(r.sp)parts.push('Sp:'+r.sp+'滴');
    if(r.s3)parts.push('S3:'+r.s3+'ml');
    return '<div class="logitem"><b>'+r.d+'</b> '+(r.note?' · '+r.note:'')+'<br><span style="color:var(--cyan);font-weight:600;">'+parts.join(' / ')+'</span><br><span style="float:right;margin-top:4px;"><button onclick="kzEdit('+i+')" style="font-size:10px;padding:2px 6px;background:var(--cyan);border:none;border-radius:4px;color:#04121f;cursor:pointer;margin-right:4px;">編輯</button><button onclick="kzDelete('+i+')" style="font-size:10px;padding:2px 6px;background:var(--pink);border:none;border-radius:4px;color:#fff;cursor:pointer;">刪除</button></span></div>';
  }).join('');
}
function kzEdit(i){
  const a=kzLoad();
  if(i<0||i>=a.length)return;
  const r=a[i];
  document.getElementById('kzYear').value=r.d.split('-')[0]||'';
  document.getElementById('kzMonth').value=r.d.split('-')[1]||'';
  document.getElementById('kzDay').value=r.d.split('-')[2]||'';
  document.getElementById('kzBak').value=r.bak||'';
  document.getElementById('kzSp').value=r.sp||'';
  document.getElementById('kzS3').value=r.s3||'';
  document.getElementById('kzNote').value=r.note||'';
  a.splice(i,1);
  kzSaveData(a);
  kzRender();
  alert('已載入編輯，修改後按「存一筆」即可更新');
}
function kzDelete(i){
  if(confirm('確定刪除此筆 KZ 記錄？')){
    const a=kzLoad();
    if(i>=0&&i<a.length){a.splice(i,1);kzSaveData(a);kzRender();alert('已刪除');}
  }
}
function kzClear(){
  if(confirm('確定清空全部 KZ 記錄？')){kzSaveData([]);kzRender();alert('已清空');}
}
// 初始化選項
(function initKzOpts(){
  const bak=document.getElementById('kzBak');
  if(bak&&!bak.options.length){
    bak.innerHTML='<option value="">-- 選擇 --</option>';for(let v=1;v<=10;v++){const o=document.createElement('option');o.value=v;o.textContent=v+' 滴';bak.appendChild(o);}
  }
  const sp=document.getElementById('kzSp');
  if(sp&&!sp.options.length){
    sp.innerHTML='<option value="">-- 選擇 --</option>';for(let v=1;v<=10;v++){const o=document.createElement('option');o.value=v;o.textContent=v+' 滴';sp.appendChild(o);}
  }
  const s3=document.getElementById('kzS3');
  if(s3&&!s3.options.length){
    s3.innerHTML='<option value="">-- 選擇 --</option>';for(let v=1;v<=90;v++){const val=(v/100).toFixed(2);const o=document.createElement('option');o.value=val;o.textContent=val+' ml';s3.appendChild(o);}
  }
})();
// 初始化日期下拉
(function initKzDate(){
  const y=document.getElementById('kzYear'),m=document.getElementById('kzMonth'),d=document.getElementById('kzDay');
  const today=new Date(),yr=today.getFullYear(),mo=today.getMonth()+1,da=today.getDate();
  if(y&&!y.options.length){for(let yr=2020;yr<=2035;yr++){const o=document.createElement('option');o.value=yr;o.textContent=yr+'年';y.appendChild(o);}}
  if(m&&!m.options.length){for(let mo=1;mo<=12;mo++){const o=document.createElement('option');o.value=mo<10?'0'+mo:mo;o.textContent=mo+'月';m.appendChild(o);}}
  if(d&&!d.options.length){for(let da=1;da<=31;da++){const o=document.createElement('option');o.value=da<10?'0'+da:da;o.textContent=da+'日';d.appendChild(o);}}
  if(y&&y.value===''){y.value=yr.toString();}
  if(m&&m.value===''){m.value=mo<10?'0'+mo:mo.toString();}
  if(d&&d.value===''){d.value=da<10?'0'+da:da.toString();}
})();
// 初始化顯示
if(typeof kzRender==='function')kzRender();
</script>
</body>
</html>
