:root{--bg:#050b14;--panel:#0c1626;--line:#1b2c44;--cyan:#00f3ff;--txt:#dbe9ff;--dim:#7e93b3;--pink:#ff5fa2;--green:#3dffb0;}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1a2e,var(--bg));color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}

header{text-align:center;padding:18px 0 10px;}

label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:700;}
input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#08111f;color:var(--txt);outline:none;}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.18);}

<script>
const SYNC_URL = 'https://kz-sync-api.vercel.app/api/kz-sync';
const LOCAL_KEY = 'kz_log_v1';

function showSyncStatus(msg, type) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.innerText = msg;
  el.className = 'sync-status ' + (type || '');
}

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function kzLoad() {
  try {
    return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function kzSaveData(a) {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(a));
  } catch (e) {}
}

function kzNewId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 6);
}

function alert(msg) {
  if (typeof window !== 'undefined' && window.alert) {
    window.alert(msg);
  }
}

function confirm(msg) {
  if (typeof window !== 'undefined' && window.confirm) {
    return window.confirm(msg);
  }
  return true;
}

async function postJSON(url, payload) {
  const opts = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, opts);
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { error: 'Network error' } };
  } finally {
    clearTimeout(timeout);
  }
}

async function deleteJSON(url) {
  if (!SYNC_URL) return true;
  try {
    const res = await fetch(url, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' }
    });
    const data = await res.json();
    return res.ok;
  } catch (e) {
    console.error('Delete request failed:', e);
    return false;
  }
}

// 從後端讀取資料
async function kzLoadFromBackend() {
  if (!SYNC_URL) return [];
  try {
    const res = await fetch(SYNC_URL, { method: 'GET' });
    const data = await res.json();
    if (res.ok && data && data.success && Array.isArray(data.data)) {
      return data.data;
    }
  } catch(e) {
    console.error('Load from backend failed:', e);
  }
  return [];
}

// 手動同步按鈕
async function kzSync() {
  showSyncStatus('🔄 同步中...', '');
  const backend = await kzLoadFromBackend();
  const local = kzLoad();
  const localIds = new Set(local.map(r => r.id));
  const backendIds = new Set(backend.map(r => r.id));
  const toAdd = backend.filter(r => !localIds.has(r.id));
  const merged = [...local, ...toAdd];
  kzSaveData(merged);
  renderKzLog(merged);
  showSyncStatus('✅ 同步完成（' + merged.length + ' 筆）', 'ok');
}

// 本地先存，然後發到後端
async function kzSaveToBackend(rec) {
  if (!SYNC_URL) return true;
  const payload = {
    id: rec.id,
    d: rec.d || new Date().toISOString().slice(0, 10),
    bak: rec.bak || null,
    sp: rec.sp || null,
    s3: rec.s3 || null,
    note: rec.note || null,
  };
  const res = await postJSON(SYNC_URL, payload);
  if (res.ok && res.status === 200 && res.data && res.data.success) {
    showSyncStatus('✅ 已同步至後端: ' + res.data.id, 'ok');
    return true;
  }
  showSyncStatus('❌ 本地存了，但同步失敗', 'err');
  return false;
}

// 刪除本地 + 請後端刪
async function kzRemoveFromBackend(id) {
  if (!SYNC_URL) return true;
  if (!id) return true;
  const res = await fetch(SYNC_URL + '/' + encodeURIComponent(id), {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' }
  });
  const data = await res.json();
  if (res.ok && data && data.success) {
    showSyncStatus('✅ 已從後端刪除: ' + id, 'ok');
    return true;
  }
  showSyncStatus('❌ 已刪本地，但後端刪除失敗', 'err');
  return false;
}

function renderKzLog(items) {
  const box = document.getElementById('kzLog');
  if (!box) return;
  if (!items || !items.length) {
    box.innerHTML = '<div style="font-size:12px;color:var(--dim);padding:10px;">還沒有 KZ 記錄</div>';
    return;
  }
  box.innerHTML = items.map(function(r, i) {
    const parts = [];
    if (r.bak) parts.push('Bak:' + r.bak + '滴');
    if (r.sp) parts.push('Sp:' + r.sp + '滴');
    if (r.s3) parts.push('S3:' + r.s3 + 'ml');
    const createdAt = r.created_at ? new Date(r.created_at).toLocaleString('zh-TW', { hour12: false }) : '';
    return '<div class="logitem">'
      + '<b>' + escapeHtml(r.d || '') + '</b> '
      + (r.note ? ' · ' + escapeHtml(r.note) : '')
      + '<br><span style="color:var(--cyan);font-weight:600;">' + parts.join(' / ') + '</span>'
      + (createdAt ? '<br><span style="font-size:11px;color:var(--dim);margin-top:4px;">' + escapeHtml(createdAt) + '</span>' : '')
      + '<br><span style="float:right;margin-top:4px;">'
      + '<button onclick="kzEdit(' + i + ')" style="font-size:10px;padding:2px 6px;background:var(--cyan);border:none;border-radius:4px;color:#04121f;cursor:pointer;margin-right:4px;">編輯</button>'
      + '<button data-del-id="' + r.id + '" class="del-btn" style="font-size:10px;padding:2px 6px;background:var(--pink);border:none;border-radius:4px;color:#fff;cursor:pointer;">刪除</button>'
      + '</span>'
      + '</div>';
  }).join('');
}

// 刪除按鈕事件代理（用 data-id 避免 onclick 引號衝突）
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.del-btn');
  if (!btn) return;
  var id = btn.getAttribute('data-del-id');
  if (id) kzDeleteItem(id);
});

async function kzSave() {
  try {
    const y = document.getElementById('kzYear') ? document.getElementById('kzYear').value : '';
    const m = document.getElementById('kzMonth') ? document.getElementById('kzMonth').value : '';
    const d = document.getElementById('kzDay') ? document.getElementById('kzDay').value : '';
    const dateVal = (y && m && d) ? (y + '-' + m + '-' + d) : new Date().toISOString().slice(0, 10);

    const rec = {
      d: dateVal,
      bak: document.getElementById('kzBak') ? document.getElementById('kzBak').value : '',
      sp: document.getElementById('kzSp') ? document.getElementById('kzSp').value : '',
      s3: document.getElementById('kzS3') ? document.getElementById('kzS3').value : '',
      note: document.getElementById('kzNote') ? document.getElementById('kzNote').value : ''
    };

    if (!rec.bak && !rec.sp && !rec.s3) {
      alert('至少選一項滴定數值');
      return;
    }

    const a = kzLoad();
    rec.id = kzNewId();
    rec.t = Date.now();
    a.unshift(rec);
    kzSaveData(a);

    const saved = await kzSaveToBackend(rec);
    renderKzLog(a);

    document.getElementById('kzBak').value = '';
    document.getElementById('kzSp').value = '';
    document.getElementById('kzS3').value = '';
    document.getElementById('kzNote').value = '';
    if (saved) {
      alert('已儲存 KZ 記錄（本地 + 同步庫）');
    } else {
      alert('已儲存本地備份，只同步失敗');
    }
  } catch (e) {
    console.error('kzSave error:', e);
    alert('儲存失敗：' + e.message);
  }
}


function kzEdit(i) {
  const a = kzLoad();
  if (i < 0 || i >= a.length) return;
  const r = a[i];
  document.getElementById('kzYear').value = r.d ? r.d.split('-')[0] : '';
  document.getElementById('kzMonth').value = r.d ? r.d.split('-')[1] : '';
  document.getElementById('kzDay').value = r.d ? r.d.split('-')[2] || '' : '';
  document.getElementById('kzBak').value = r.bak || '';
  document.getElementById('kzSp').value = r.sp || '';
  document.getElementById('kzS3').value = r.s3 || '';
  document.getElementById('kzNote').value = r.note || '';
  a.splice(i, 1);
  kzSaveData(a);
  renderKzLog(a);
  alert('已載入編輯，修改後按「存一筆」即可更新');
}

async function kzDeleteItem(id) {
  const a = kzLoad();
  const idx = a.findIndex(function(r) { return r.id === id; });
  if (idx === -1) {
    alert('找不到該筆記錄');
    return;
  }
  const ok = await kzRemoveFromBackend(id);
  if (ok) {
    a.splice(idx, 1);
    kzSaveData(a);
    renderKzLog(a);
    alert('已刪除（本地 + 後端）');
  } else {
    alert('後端刪除失敗，本地記錄保留');
  }
}

function kzClear() {
  if (!confirm('確定清空全部 KZ 記錄？')) return;
  const a = kzLoad();
  kzSaveData(a);
  renderKzLog(a);
  if (!SYNC_URL) {
    showSyncStatus('⚪ 未設定後端: 請在 SYNC_URL 填入後端網址', '');
    alert('已清空本地記錄，但沒有後端，同步不會運作。');
    return;
  }
  const ids = a.map(function(r) { return r.id; });
  Promise.all(ids.map(function(id) {
    return deleteJSON(SYNC_URL + '/' + encodeURIComponent(id));
  })).then(function(results) {
    const failed = results.filter(function(x) { return !x; });
    if (failed.length === 0) {
      showSyncStatus('✅ 已清空後端', 'ok');
    } else {
      showSyncStatus('⚠️ 本地清空完成，後端清空部分失敗', 'err');
    }
  }).catch(function(e) {
    showSyncStatus('❌ 清空過程中發生錯誤', 'err');
  });
}

(function initKzOpts() {
  const bak = document.getElementById('kzBak');
  if (bak) {
    for (var v = 1; v <= 10; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 滴';
      bak.appendChild(o);
    }
  }
  const sp = document.getElementById('kzSp');
  if (sp) {
    for (var v = 1; v <= 10; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 滴';
      sp.appendChild(o);
    }
  }
  const s3 = document.getElementById('kzS3');
  if (s3) {
    for (var v = 1; v <= 90; v++) {

(function initKzDate() {
  const y = document.getElementById('kzYear');
  const m = document.getElementById('kzMonth');
  const d = document.getElementById('kzDay');
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const day = today.getDate();
  if (y) {
    for (var v = 2020; v <= 2035; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 年';
      y.appendChild(o);
    }
    y.value = year.toString();
  }
  if (m) {
    for (var v = 1; v <= 12; v++) {
      var o = document.createElement('option');
      o.value = v < 10 ? '0' + v : v;
      o.textContent = v + '月';
      m.appendChild(o);
    }
    m.value = month < 10 ? '0' + month : month.toString();
  }
  if (d) {
    for (var v = 1; v <= 31; v++) {
      var o = document.createElement('option');
      o.value = v < 10 ? '0' + v : v;
      o.textContent = v + '日';
      d.appendChild(o);
    }
    d.value = day < 10 ? '0' + day : day.toString();
  }
})();

(async function initApp() {
  try {
    // 先從後端載入資料，合併到本地
    const backendItems = await kzLoadFromBackend();
    if (backendItems.length > 0) {
      const localItems = kzLoad();
      const localIds = new Set(localItems.map(r => r.id));
      const newItems = backendItems.filter(r => !localIds.has(r.id));
      const merged = [...localItems, ...newItems];
      kzSaveData(merged);
      renderKzLog(merged);
    } else {
      const items = kzLoad();
      renderKzLog(items);
    }
    if (!SYNC_URL) {
      showSyncStatus('⚪ 不安全模式: 尚未設定後端，僅存本機', '');
    } else {
      showSyncStatus('🔄 後端已設定，記錄將同步至後端', 'ok');
      // 每 10 秒自動從後端同步一次
      setInterval(async () => {
        try {
          const backend = await kzLoadFromBackend();
          const local = kzLoad();
          const localIds = new Set(local.map(r => r.id));
          const backendIds = new Set(backend.map(r => r.id));
          // 合併：本地有但後端沒有 → 補進後端；後端有但本地沒有 → 補進本地
          const toAdd = backend.filter(r => !localIds.has(r.id));
          const toRemove = local.filter(r => !backendIds.has(r.id));
          const merged = [...local, ...toAdd];
          kzSaveData(merged);
          renderKzLog(merged);
        } catch(e) {
          console.error('Auto sync failed:', e);
        }
      }, 10000);
    }
  } catch (e) {
    showSyncStatus('❌ 初始化失敗', 'err');
    console.error('initApp error:', e);
  }
})();
</script>
