<style>
:root{--bg:#050b14;--panel:#0c1626;--line:#1b2c44;--cyan:#00f3ff;--txt:#dbe9ff;--dim:#7e93b3;--pink:#ff5fa2;--green:#3dffb0;}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1a2e,var(--bg));color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px;}
header{text-align:center;padding:18px 0 10px;}
header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 28px rgba(0,243,255,.5);}
header p{margin:6px 0 0;color:var(--dim);font-size:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.card h2{margin:0 0 12px;font-size:16px;color:var(--cyan);text-shadow:0 0 10px rgba(0,243,255,.4);}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:700;}
input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#08111f;color:var(--txt);outline:none;}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.18);}
.btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:900;color:#04121f;cursor:pointer;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 18px rgba(0,243,255,.45);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none;}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6;}
.logitem{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:13px;background:#08111f;}
.logitem .del{float:right;color:var(--pink);font-size:12px;cursor:pointer;font-weight:700;margin-left:8px;}
.logitem .edit{float:right;color:var(--cyan);font-size:12px;cursor:pointer;font-weight:700;margin-right:8px;}
.sync-status{font-size:11px;color:var(--dim);margin-top:6px;text-align:center;}
.sync-status.ok{color:var(--green);}
.sync-status.err{color:var(--pink);}
</style>
</head>

<script>
// === 設定頁面層級 Supabase 連線 ===
// 請先到 Supabase 建立專案，把項目填入下方
// 示範：
//   supabaseUrl = 'https://xxx.supabase.co'
//   supabaseAnonKey = 'eyJ...'
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

let supabase = null;

function initSupabase() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    try {
      supabase = window['supabase-js'] ? window['supabase-js'].createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
      if (supabase) {
        return supabase;
      } else {
        document.getElementById('syncStatus').innerText = '⚠️ 找不到 Supabase 套件，請檢查網路';
        document.getElementById('syncStatus').className = 'sync-status err';
        return null;
      }
    } catch(e) {
      document.getElementById('syncStatus').innerText = '⚠️ Supabase 初始化失敗: ' + e.message;
      document.getElementById('syncStatus').className = 'sync-status err';
      return null;
    }
  } else {
    document.getElementById('syncStatus').innerText = '⚪ 待設定: 請在 script 頂端填入 Supabase URL 與 Anon Key';
    document.getElementById('syncStatus').className = 'sync-status';
    return null;
  }
}

const KZ_TABLE = 'kz_log';

function getSupabase() {
  if (!supabase) {
    supabase = initSupabase();
  }
  return supabase;
}

function uid() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).substr(2, 6);
}

function showSyncStatus(msg, type) {
  const el = document.getElementById('syncStatus');
  if (el) {
    el.innerText = msg;
    el.className = 'sync-status ' + (type || '');
  }
}

async function kzSaveToSupabase(rec) {
  const sb = getSupabase();
  if (!sb) return false;
  try {
    const { error } = await sb.from(KZ_TABLE).insert([
      {
        id: uid(),
        d: rec.d,
        bak: rec.bak,
        sp: rec.sp,
        s3: rec.s3,
        note: rec.note,
        created_at: new Date().toISOString()
      }
    ]);
    if (error) {
      console.error('Supabase save error', error);
      showSyncStatus('⚠️ 寫入失敗: ' + error.message, 'err');
      return false;
    }
    showSyncStatus('✅ 已同步至 Supabase', 'ok');
    return true;
  } catch (e) {
    console.error('Supabase save exception', e);
    showSyncStatus('⚠️ 寫入失敗: ' + e.message, 'err');
    return false;
  }
}

async function kzLoadFromSupabase() {
  const sb = getSupabase();
  if (!sb) return [];
  try {
    showSyncStatus('⏳ 載入中...');
    const { data, error } = await sb.from(KZ_TABLE).select('*').order('created_at', { ascending: false });
    if (error) {
      console.error('Supabase load error', error);
      showSyncStatus('⚠️ 載入失敗: ' + error.message, 'err');
      return [];
    }
    showSyncStatus('✅ 已載入 ' + (data ? data.length : 0) + ' 筆');
    return data || [];
  } catch (e) {
    console.error('Supabase load exception', e);
    showSyncStatus('⚠️ 載入失敗: ' + e.message, 'err');
    return [];
  }
}

async function kzDeleteFromSupabase(id) {
  const sb = getSupabase();
  if (!sb) return false;
  try {
    const { error } = await sb.from(KZ_TABLE).delete().eq('id', id);
    if (error) {
      console.error('Supabase delete error', error);
      showSyncStatus('⚠️ 刪除失敗: ' + error.message, 'err');
      return false;
    }
    showSyncStatus('✅ 已從 Supabase 刪除 ' + id, 'ok');
    return true;
  } catch (e) {
    console.error('Supabase delete exception', e);
    showSyncStatus('⚠️ 刪除失敗: ' + e.message, 'err');
    return false;
  }
}

async function kzClearFromSupabase() {
  const sb = getSupabase();
  if (!sb) return false;
  try {
    const { error } = await sb.from(KZ_TABLE).delete().eq('id', 'temp-purge');
    if (error) {
      console.error('Supabase clear error', error);
      showSyncStatus('⚠️ 清空失敗: ' + error.message, 'err');
      return false;
    }
    showSyncStatus('✅ 已從 Supabase 清空', 'ok');
    return true;
  } catch (e) {
    console.error('Supabase clear exception', e);
    showSyncStatus('⚠️ 清空失敗: ' + e.message, 'err');
    return false;
  }
}

function renderKzLog(items) {
  const box = document.getElementById('kzLog');
  if (!box) return;
  if (!items || !items.length) {
    box.innerHTML = '<div style="font-size:12px;color:var(--dim);padding:10px;">還沒有 KZ 記錄</div>';
    return;
  }
  box.innerHTML = items.map(function(r, i) {
    const parts = [];
    if (r.bak) parts.push('Bak:' + r.bak + '滴');
    if (r.sp) parts.push('Sp:' + r.sp + '滴');
    if (r.s3) parts.push('S3:' + r.s3 + 'ml');
    const createdAt = r.created_at ? new Date(r.created_at).toLocaleString('zh-TW', {hour12: false}) : '';
    const logId = r.id || i;
    return '<div class="logitem"><b>' + escapeHtml(r.d || '') + '</b> ' + (r.note ? ' · ' + escapeHtml(r.note) : '') + '<br><span style="color:var(--cyan);font-weight:600;">' + parts.join(' / ') + '</span>' + (createdAt ? '<br><span style="font-size:11px;color:var(--dim);">' + escapeHtml(createdAt) + '</span>' : '') + '<br><span style="float:right;margin-top:4px;"><button onclick="kzEdit(' + i + ')" style="font-size:10px;padding:2px 6px;background:var(--cyan);border:none;border-radius:4px;color:#04121f;cursor:pointer;margin-right:4px;">編輯</button><button onclick="kzDelete(' + i + ')" style="font-size:10px;padding:2px 6px;background:var(--pink);border:none;border-radius:4px;color:#fff;cursor:pointer;">刪除</button></span></div>';
  }).join('');
}

function escapeHtml(str) {
  if (typeof str !== 'string') return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function kzLoad() {
  try {
    return JSON.parse(localStorage.getItem('kz_log_v1') || '[]');
  } catch(e) {
    return [];
  }
}

function kzSaveData(a) {
  try {
    localStorage.setItem('kz_log_v1', JSON.stringify(a));
  } catch(e) {}
}

function kzNewId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2);
}

function alert(msg) {
  if (typeof window !== 'undefined' && window.alert) {
    window.alert(msg);
  }
}

function confirm(msg) {
  if (typeof window !== 'undefined' && window.confirm) {
    return window.confirm(msg);
  }
  return true;
}

function kzSave() {
  try {
    const y = document.getElementById('kzYear') ? document.getElementById('kzYear').value : '';
    const m = document.getElementById('kzMonth') ? document.getElementById('kzMonth').value : '';
    const d = document.getElementById('kzDay') ? document.getElementById('kzDay').value : '';
    const dateVal = (y && m && d) ? (y + '-' + m + '-' + d) : new Date().toISOString().slice(0, 10);

    const rec = {
      d: dateVal,
      bak: document.getElementById('kzBak') ? document.getElementById('kzBak').value : '',
      sp: document.getElementById('kzSp') ? document.getElementById('kzSp').value : '',
      s3: document.getElementById('kzS3') ? document.getElementById('kzS3').value : '',
      note: document.getElementById('kzNote') ? document.getElementById('kzNote').value : ''
    };

    if (!rec.bak && !rec.sp && !rec.s3) {
      alert('至少選一項滴定數值');
      return;
    }

    const a = kzLoad();
    rec.id = kzNewId();
    rec.t = Date.now();
    a.unshift(rec);
    kzSaveData(a);

    const saved = kzSaveToSupabase(rec);
    renderKzLog(a);

    document.getElementById('kzBak').value = '';
    document.getElementById('kzSp').value = '';
    document.getElementById('kzS3').value = '';
    document.getElementById('kzNote').value = '';
    if (saved) {
      alert('已儲存 KZ 記錄（「存一筆」+「同步庫」）');
    } else {
      alert('已儲存本地備份，只同步失敗');
    }
  } catch (e) {
    console.error('kzSave error:', e);
    alert('儲存失敗：' + e.message);
  }
}

function kzEdit(i) {
  const a = kzLoad();
  if (i < 0 || i >= a.length) return;
  const r = a[i];
  document.getElementById('kzYear').value = r.d ? r.d.split('-')[0] : '';
  document.getElementById('kzMonth').value = r.d ? r.d.split('-')[1] : '';
  document.getElementById('kzDay').value = r.d ? r.d.split('-')[2] || '' : '';
  document.getElementById('kzBak').value = r.bak || '';
  document.getElementById('kzSp').value = r.sp || '';
  document.getElementById('kzS3').value = r.s3 || '';
  document.getElementById('kzNote').value = r.note || '';
  a.splice(i, 1);
  kzSaveData(a);
  renderKzLog(a);
  alert('已載入編輯，修改後按「存一筆」即可更新');
}

function kzDelete(i) {
  if (!confirm('確定刪除此筆 KZ 記錄？')) return;
  const a = kzLoad();
  if (i >= 0 && i < a.length) {
    const r = a[i];
    const ok = kzDeleteFromSupabase(r.id);
    a.splice(i, 1);
    kzSaveData(a);
    renderKzLog(a);
    alert('已刪除本地記錄，已同步刪除 Supabase: ' + ok);
  }
}

function kzClear() {
  if (!confirm('確定清空全部 KZ 記錄？')) return;
  const a = kzLoad();
  kzSaveData(a);
  renderKzLog(a);
  const ok = kzClearFromSupabase();
  alert('已清空本地記錄，已同步清空 Supabase: ' + ok);
}

(function initKzOpts() {
  const bak = document.getElementById('kzBak');
  if (bak) {
    for (var v = 1; v <= 10; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 滴';
      bak.appendChild(o);
    }
  }
  const sp = document.getElementById('kzSp');
  if (sp) {
    for (var v = 1; v <= 10; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 滴';
      sp.appendChild(o);
    }
  }
  const s3 = document.getElementById('kzS3');
  if (s3) {
    for (var v = 1; v <= 90; v++) {
      var val = (v / 100).toFixed(2);
      var o = document.createElement('option');
      o.value = val;
      o.textContent = val + ' ml';
      s3.appendChild(o);
    }
  }
})();

(function initKzDate() {
  const y = document.getElementById('kzYear');
  const m = document.getElementById('kzMonth');
  const d = document.getElementById('kzDay');
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth() + 1;
  const day = today.getDate();

  if (y) {
    for (var v = 2020; v <= 2035; v++) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + ' 年';
      y.appendChild(o);
    }
    y.value = year.toString();
  }
  if (m) {
    for (var v = 1; v <= 12; v++) {
      var o = document.createElement('option');
      o.value = v < 10 ? '0' + v : v;
      o.textContent = v + '月';
      m.appendChild(o);
    }
    m.value = month < 10 ? '0' + month : month.toString();
  }
  if (d) {
    for (var v = 1; v <= 31; v++) {
      var o = document.createElement('option');
      o.value = v < 10 ? '0' + v : v;
      o.textContent = v + '日';
      d.appendChild(o);
    }
    d.value = day < 10 ? '0' + day : day.toString();
  }
})();

// 初始化：載入遠端 Supabase 並顯示
(function initApp() {
  kzLoadFromSupabase().then(function(items) {
    renderKzLog(items);
  });
})();
</script>
