<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KZ 滴定機記錄 | 海水小幫手</title>
<style>
:root{--bg:#04121f;--panel:#0a1e33;--line:#1a3a5c;--cyan:#00f3ff;--green:#00ff9d;--pink:#ff4d6d;--txt:#e0f0ff;--dim:#7a9ab8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;min-height:100vh;}
header{text-align:center;padding:18px 0 10px;}
header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 0 14px var(--cyan),0 0 28px rgba(0,243,255,.5);}
header p{margin:6px 0 0;color:var(--dim);font-size:12px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35);}
.card h2{margin:0 0 12px;font-size:16px;color:var(--cyan);text-shadow:0 0 10px rgba(0,243,255,.4);}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:700;}
input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#08111f;color:var(--txt);outline:none;}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.18);}
.btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:900;color:#04121f;cursor:pointer;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 18px rgba(0,243,255,.45);}
.btn:active{transform:scale(.97);}
.logitem{background:#08111f;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:13px;line-height:1.6;}
.sync-status{margin-top:10px;font-size:12px;padding:8px;border-radius:8px;text-align:center;}
.sync-status.ok{background:rgba(0,255,157,.15);color:var(--green);}
.sync-status.err{background:rgba(255,77,109,.15);color:var(--pink);}
</style>
</head>
<body>
<header>
<h1>💧 KZ 滴定機記錄</h1>
<p>獨立頁面 · 完整記錄功能 · 支援手機/平板自動同步（後端轉發）</p>
</header>
<div class="card">
<h2>📋 新增記錄</h2>
<label>日期</label>
<select id="kzYear"></select>
<select id="kzMonth"></select>
<select id="kzDay"></select>
<label>KZ Bak 滴速</label>
<select id="kzBak"><option value="">-- 選擇 --</option><option value="1">1 滴</option><option value="2">2 滴</option><option value="3">3 滴</option><option value="4">4 滴</option><option value="5">5 滴</option><option value="6">6 滴</option><option value="7">7 滴</option><option value="8">8 滴</option><option value="9">9 滴</option><option value="10">10 滴</option></select>
<label>Kz Sp 滴速</label>
<select id="kzSp"><option value="">-- 選擇 --</option><option value="1">1 滴</option><option value="2">2 滴</option><option value="3">3 滴</option><option value="4">4 滴</option><option value="5">5 滴</option><option value="6">6 滴</option><option value="7">7 滴</option><option value="8">8 滴</option><option value="9">9 滴</option><option value="10">10 滴</option></select>
<label>Kz S3 劑量</label>
<select id="kzS3"><option value="">-- 選擇 --</option><option value="0.01">0.01 ml</option><option value="0.02">0.02 ml</option><option value="0.03">0.03 ml</option><option value="0.04">0.04 ml</option><option value="0.05">0.05 ml</option><option value="0.06">0.06 ml</option><option value="0.07">0.07 ml</option><option value="0.08">0.08 ml</option><option value="0.09">0.09 ml</option><option value="0.10">0.10 ml</option><option value="0.11">0.11 ml</option><option value="0.12">0.12 ml</option><option value="0.13">0.13 ml</option><option value="0.14">0.14 ml</option><option value="0.15">0.15 ml</option><option value="0.16">0.16 ml</option><option value="0.17">0.17 ml</option><option value="0.18">0.18 ml</option><option value="0.19">0.19 ml</option><option value="0.20">0.20 ml</option><option value="0.21">0.21 ml</option><option value="0.22">0.22 ml</option><option value="0.23">0.23 ml</option><option value="0.24">0.24 ml</option><option value="0.25">0.25 ml</option><option value="0.26">0.26 ml</option><option value="0.27">0.27 ml</option><option value="0.28">0.28 ml</option><option value="0.29">0.29 ml</option><option value="0.30">0.30 ml</option><option value="0.31">0.31 ml</option><option value="0.32">0.32 ml</option><option value="0.33">0.33 ml</option><option value="0.34">0.34 ml</option><option value="0.35">0.35 ml</option><option value="0.36">0.36 ml</option><option value="0.37">0.37 ml</option><option value="0.38">0.38 ml</option><option value="0.39">0.39 ml</option><option value="0.40">0.40 ml</option><option value="0.41">0.41 ml</option><option value="0.42">0.42 ml</option><option value="0.43">0.43 ml</option><option value="0.44">0.44 ml</option><option value="0.45">0.45 ml</option><option value="0.46">0.46 ml</option><option value="0.47">0.47 ml</option><option value="0.48">0.48 ml</option><option value="0.49">0.49 ml</option><option value="0.50">0.50 ml</option><option value="0.51">0.51 ml</option><option value="0.52">0.52 ml</option><option value="0.53">0.53 ml</option><option value="0.54">0.54 ml</option><option value="0.55">0.55 ml</option><option value="0.56">0.56 ml</option><option value="0.57">0.57 ml</option><option value="0.58">0.58 ml</option><option value="0.59">0.59 ml</option><option value="0.60">0.60 ml</option><option value="0.61">0.61 ml</option><option value="0.62">0.62 ml</option><option value="0.63">0.63 ml</option><option value="0.64">0.64 ml</option><option value="0.65">0.65 ml</option><option value="0.66">0.66 ml</option><option value="0.67">0.67 ml</option><option value="0.68">0.68 ml</option><option value="0.69">0.69 ml</option><option value="0.70">0.70 ml</option><option value="0.71">0.71 ml</option><option value="0.72">0.72 ml</option><option value="0.73">0.73 ml</option><option value="0.74">0.74 ml</option><option value="0.75">0.75 ml</option><option value="0.76">0.76 ml</option><option value="0.77">0.77 ml</option><option value="0.78">0.78 ml</option><option value="0.79">0.79 ml</option><option value="0.80">0.80 ml</option><option value="0.81">0.81 ml</option><option value="0.82">0.82 ml</option><option value="0.83">0.83 ml</option><option value="0.84">0.84 ml</option><option value="0.85">0.85 ml</option><option value="0.86">0.86 ml</option><option value="0.87">0.87 ml</option><option value="0.88">0.88 ml</option><option value="0.89">0.89 ml</option><option value="0.90">0.90 ml</option></select>
<label>備註</label>
<input id="kzNote" placeholder="例如 換水前測量 / 調整滴速">
<button class="btn" onclick="kzSave()">存一筆 KZ 記錄</button>
</div>
<div class="card">
<h2>📦 記錄列表</h2>
<button class="btn" style="background:linear-gradient(90deg,var(--pink),var(--cyan));margin-top:0;" onclick="kzClear()">清空全部</button>
<div id="kzLog" style="margin-top:12px;"></div>
<div id="syncStatus" class="sync-status">⏳ 載入中...</div>
</div>
<script>
const SYNC_URL = 'https://kz-sync-api.vercel.app/api/kz-sync';
const LOCAL_KEY = 'kz_log_v1';

function showSyncStatus(msg, type) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.innerText = msg;
  el.className = 'sync-status ' + (type || '');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function kzLoad() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e) { return []; }
}

function kzSaveData(arr) {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(arr));
}

function kzNewId() {
  return Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

async function postJSON(url, payload) {
  const opts = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  };
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(url, { ...opts, signal: controller.signal });
    const data = await res.json();
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: { error: 'Network error' } };
  } finally {
    clearTimeout(timeout);
  }
}

async function kzSaveToBackend(rec) {
  if (!SYNC_URL) return true;
  const payload = {
    d: rec.d || new Date().toISOString().slice(0, 10),
    bak: rec.bak || null,
    sp: rec.sp || null,
    s3: rec.s3 || null,
    note: rec.note || null,
  };
  const res = await postJSON(SYNC_URL, payload);
  if (res.ok && res.status === 200 && res.data && res.data.success) {
    showSyncStatus('✅ 已同步至後端: ' + res.data.id, 'ok');
    return true;
  }
  showSyncStatus('❌ 本地存了，但同步失敗', 'err');
  return false;
}

async function kzRemoveFromBackend(id) {
  if (!SYNC_URL) return true;
  if (!id) return true;
  try {
    const res = await fetch(SYNC_URL + '/' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' }
    });
    const data = await res.json();
    if (res.ok && data && data.success) {
      showSyncStatus('✅ 已從後端刪除: ' + id, 'ok');
      return true;
    }
    showSyncStatus('❌ 已刪本地，但後端刪除失敗', 'err');
    return false;
  } catch(e) {
    showSyncStatus('❌ 後端刪除網路錯誤', 'err');
    return false;
  }
}

function renderKzLog(items) {
  const box = document.getElementById('kzLog');
  if (!box) return;
  if (!items || !items.length) {
    box.innerHTML = '<div style="font-size:12px;color:var(--dim);padding:10px;">還沒有 KZ 記錄</div>';
    return;
  }
  box.innerHTML = items.map(function(r, i) {
    const parts = [];
    if (r.bak) parts.push('Bak:' + r.bak + '滴');
    if (r.sp) parts.push('Sp:' + r.sp + '滴');
    if (r.s3) parts.push('S3:' + r.s3 + 'ml');
    const createdAt = r.created_at ? new Date(r.created_at).toLocaleString('zh-TW', { hour12: false }) : '';
    return '<div class="logitem">'
      + '<b>' + escapeHtml(r.d || '') + '</b> '
      + (r.note ? ' · ' + escapeHtml(r.note) : '')
      + '<br><span style="color:var(--cyan);font-weight:600;">' + parts.join(' / ') + '</span>'
      + (createdAt ? '<br><span style="font-size:11px;color:var(--dim);margin-top:4px;">' + escapeHtml(createdAt) + '</span>' : '')
      + '<br><span style="float:right;margin-top:4px;">'
      + '<button onclick="kzEdit(' + i + ')" style="font-size:10px;padding:2px 6px;background:var(--cyan);border:none;border-radius:4px;color:#04121f;cursor:pointer;margin-right:4px;">編輯</button>'
      + '<button onclick="kzDeleteItem(' + JSON.stringify(r.id) + ')" style="font-size:10px;padding:2px 6px;background:var(--pink);border:none;border-radius:4px;color:#fff;cursor:pointer;">刪除</button>'
      + '</span>'
      + '</div>';
  }).join('');
}

async function kzSave() {
  try {
    const y = document.getElementById('kzYear') ? document.getElementById('kzYear').value : '';
    const m = document.getElementById('kzMonth') ? document.getElementById('kzMonth').value : '';
    const d = document.getElementById('kzDay') ? document.getElementById('kzDay').value : '';
    const dateVal = (y && m && d) ? (y + '-' + m + '-' + d) : new Date().toISOString().slice(0, 10);

    const rec = {
      d: dateVal,
      bak: document.getElementById('kzBak') ? document.getElementById('kzBak').value : '',
      sp: document.getElementById('kzSp') ? document.getElementById('kzSp').value : '',
      s3: document.getElementById('kzS3') ? document.getElementById('kzS3').value : '',
      note: document.getElementById('kzNote') ? document.getElementById('kzNote').value : ''
    };

    if (!rec.bak && !rec.sp && !rec.s3) {
      alert('至少選一項滴定數值');
      return;
    }

    const a = kzLoad();
    rec.id = kzNewId();
    rec.t = Date.now();
    a.unshift(rec);
    kzSaveData(a);

    const saved = await kzSaveToBackend(rec);
    renderKzLog(a);

    document.getElementById('kzBak').value = '';
    document.getElementById('kzSp').value = '';
    document.getElementById('kzS3').value = '';
    document.getElementById('kzNote').value = '';
    if (saved) {
      alert('已儲存 KZ 記錄（本地 + 同步庫）');
    } else {
      alert('已儲存本地備份，只同步失敗');
    }
  } catch (e) {
    console.error('kzSave error:', e);
    alert('儲存失敗：' + e.message);
  }
}

function kzEdit(i) {
  const a = kzLoad();
  if (i < 0 || i >= a.length) return;
  const r = a[i];
  document.getElementById('kzYear').value = r.d ? r.d.split('-')[0] : '';
  document.getElementById('kzMonth').value = r.d ? r.d.split('-')[1] : '';
  document.getElementById('kzDay').value = r.d ? r.d.split('-')[2] : '';
  document.getElementById('kzBak').value = r.bak || '';
  document.getElementById('kzSp').value = r.sp || '';
  document.getElementById('kzS3').value = r.s3 || '';
  document.getElementById('kzNote').value = r.note || '';
  alert('已載入編輯，修改後按「存一筆」即可更新');
}

async function kzDeleteItem(id) {
  const a = kzLoad();
  const idx = a.findIndex(function(r) { return r.id === id; });
  if (idx === -1) {
    alert('找不到該筆記錄');
    return;
  }
  const ok = await kzRemoveFromBackend(id);
  a.splice(idx, 1);
  kzSaveData(a);
  renderKzLog(a);
  if (ok) {
    alert('已刪除（本地 + 後端）');
  } else {
    alert('已刪除本地，後端刪除失敗');
  }
}

function kzClear() {
  if (!confirm('確定清空全部 KZ 記錄？')) return;
  kzSaveData([]);
  renderKzLog([]);
  showSyncStatus('已清空本地記錄', '');
}

// 初始化日期下拉
(function() {
  const y = document.getElementById('kzYear');
  const m = document.getElementById('kzMonth');
  const d = document.getElementById('kzDay');
  if (y) {
    y.innerHTML = '<option value="">-- 選擇 --</option>';
    for (let i = 2020; i <= 2035; i++) {
      y.innerHTML += '<option value="' + i + '">' + i + ' 年</option>';
    }
  }
  if (m) {
    m.innerHTML = '<option value="">-- 選擇 --</option>';
    for (let i = 1; i <= 12; i++) {
      m.innerHTML += '<option value="' + (i < 10 ? '0' + i : i) + '">' + i + ' 月</option>';
    }
  }
  if (d) {
    d.innerHTML = '<option value="">-- 選擇 --</option>';
    for (let i = 1; i <= 31; i++) {
      d.innerHTML += '<option value="' + (i < 10 ? '0' + i : i) + '">' + i + ' 日</option>';
    }
  }
  // 預設今天
  const now = new Date();
  if (y) y.value = now.getFullYear();
  if (m) m.value = String(now.getMonth() + 1).padStart(2, '0');
  if (d) d.value = String(now.getDate()).padStart(2, '0');
  // 載入記錄
  const items = kzLoad();
  renderKzLog(items);
  if (SYNC_URL) {
    showSyncStatus('後端已設定，記錄將同步至後端', '');
  } else {
    showSyncStatus('⚪ 未設定後端', '');
  }
})();
</script>
</body>
</html>
