<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海水小幫手 | Reef Tools</title>
<style>
  :root{
    --bg:#050b14; --panel:#0c1626; --line:#1b2c44;
    --cyan:#00f3ff; --purple:#b388ff; --green:#3dffb0; --pink:#ff5fa2;
    --txt:#dbe9ff; --dim:#7e93b3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#0a1a2e,var(--bg));
    color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}
  header{text-align:center;padding:18px 0 10px}
  header h1{margin:0;font-size:24px;font-weight:900;letter-spacing:1px;
    color:#fff;text-shadow:0 0 14px var(--cyan),0 0 28px rgba(0,243,255,.5)}
  header p{margin:6px 0 0;color:var(--dim);font-size:12px}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 2px;position:sticky;top:0;
    background:linear-gradient(var(--bg),rgba(5,11,20,.92));z-index:20}
  .tab{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line);border-radius:999px;
    font-size:13px;font-weight:700;color:var(--dim);background:var(--panel);white-space:nowrap}
  .tab.on{color:#04121f;background:linear-gradient(90deg,var(--cyan),var(--green));
    border-color:transparent;box-shadow:0 0 16px rgba(0,243,255,.5)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin:12px 0;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font-size:16px;color:var(--cyan);
    text-shadow:0 0 10px rgba(0,243,255,.4)}
  label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;font-weight:700}
  input,select{width:100%;padding:12px;font-size:16px;border-radius:10px;
    border:1px solid var(--line);background:#08111f;color:var(--txt);outline:none}
  input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,243,255,.18)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .fld{display:flex;flex-direction:column}
  .custom{margin-top:6px}
  .btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;
    font-size:15px;font-weight:900;color:#04121f;cursor:pointer;
    background:linear-gradient(90deg,var(--cyan),var(--green));
    box-shadow:0 0 18px rgba(0,243,255,.45)}
  .btn.alt{background:linear-gradient(90deg,var(--purple),var(--pink));
    box-shadow:0 0 18px rgba(179,136,255,.45);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);box-shadow:none}
  .btn.on{background:linear-gradient(90deg,var(--green),var(--cyan));color:#04121f;box-shadow:0 0 18px rgba(61,255,176,.5)}
  .out{margin-top:14px;padding:14px;border-radius:12px;background:#08111f;
    border:1px dashed var(--line);font-size:15px;line-height:1.7}
  .out b{color:var(--green);font-size:18px}
  .hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.6}
  .seg{display:flex;gap:6px;margin:6px 0}
  .seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;
    background:#08111f;color:var(--dim);font-weight:700;font-size:13px}
  .seg button.on{color:#04121f;background:linear-gradient(90deg,var(--purple),var(--pink));border-color:transparent}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--cyan);font-weight:700}
  .logitem{padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px;font-size:13px}
  .del{float:right;color:var(--pink);font-size:12px;cursor:pointer;font-weight:700;margin-left:8px}
  .edit{float:right;color:var(--cyan);font-size:12px;cursor:pointer;font-weight:700}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:999px;
    background:rgba(255,95,162,.15);color:var(--pink);font-weight:700;margin-left:6px}
  footer{text-align:center;color:var(--dim);font-size:11px;padding:20px 0}
  .badge{font-size:10px;padding:1px 6px;border-radius:6px;background:#102236;color:var(--dim);margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌊 海水小幫手</h1>
    <p>數據紀錄　手機平板都能點</p>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab on" data-t="log">數據紀錄</div>
  </div>

  <!-- 數據紀錄 -->
  <section id="log" class="tabpane">
    <div class="card">
      <h2>📋 水質數據紀錄</h2>
      <div class="row">
        <div><label>日期</label><input id="lDate" type="date"></div>
        <div><label>水溫 (°C)</label><input id="lTemp" type="number" inputmode="decimal" placeholder="25"></div>
      </div>
      <div class="row">
        <div><label>KH (dKH)</label><input id="lKH" type="number" inputmode="decimal"></div>
        <div><label>Ca (mg/L)</label><input id="lCa" type="number" inputmode="decimal"></div>
      </div>
      <div class="row">
        <div><label>Mg (mg/L)</label><input id="lMg" type="number" inputmode="decimal"></div>
        <div><label>NO3 (mg/L)</label><input id="lNO3" type="number" inputmode="decimal"></div>
      </div>
      <div class="row">
        <div><label>PO4 (mg/L)<span class="tag">換水前</span></label><input id="lPO4" type="number" inputmode="decimal"></div>
        <div><label>比重 sg</label><input id="lSG" type="number" inputmode="decimal" step="0.001"></div>
      </div>
      <div class="row">
        <div><label>滴定機模式</label>
          <select id="lDripMode">
            <option value="">-- 請選擇 --</option>
            <option value="KZ_Bak">KZ Bak: 1~10 滴</option>
            <option value="Kz_Sp">Kz Sp: 1~10 滴</option>
            <option value="Kz_S3">Kz S3: 0.1~0.9 ml</option>
          </select>
        </div>
      </div>
      <label>備註</label>
      <input id="lNote" type="text" placeholder="例如 換水40L / 加鹽調比重">
      <button class="btn" id="logBtn">存一筆</button>
      <button class="btn ghost" id="logCancel" style="display:none;margin-top:8px">取消編輯</button>
      <div class="hint">⚠️ PO4 等數值一律記「換水前（BEFORE）」測量的，跟哥哥習慣一致。</div>
    </div>

    <div class="card">
      <h2>📜 紀錄列表（本機儲存）</h2>
      <button class="btn ghost" id="expBtn">匯出 CSV</button>
      <button class="btn ghost" id="impBtn" style="margin-top:8px">匯入 CSV</button>
      <input id="impFile" type="file" accept=".csv,text/csv" style="display:none">
      <button class="btn ghost" id="clrBtn" style="margin-top:8px">清空全部</button>
      <div id="logList"></div>
    </div>
  </section>

  <footer>小雲兒幫哥哥做的 💛 數值僅供參考，實際以檢測器材為準</footer>
</div>

<script>
/* ===== 海鹽係數表（g/L @35ppt）===== */
const SALTS = [
  {id:'rss',  name:'Red Sea Salt（紅海鹽/藍桶）', gpl:37.9, src:'原廠建議 ~38g/L @35ppt（哥哥實測泡完 1.025–1.026 均正常）'},
  {id:'rscp', name:'Red Sea Coral Pro（紅海珊瑚Pro）', gpl:38.2, src:'官方手冊'},
  {id:'io',   name:'Instant Ocean', gpl:35.0, src:'官方 FAQ'},
  {id:'rc',   name:'Reef Crystals', gpl:40.8, src:'社群常見值'},
  {id:'tmp',  name:'Tropic Marin Pro Reef', gpl:35.0, src:'社群（33–35有歧義）'},
  {id:'rpm',  name:'Fritz RPM Reef Pro Mix', gpl:37.9, src:'社群推估'},
  {id:'av',   name:'aquavitro Salinity', gpl:36.0, src:'官方'},
  {id:'bw',   name:'Brightwell NeoMarine', gpl:38.0, src:'社群常見值'},
];

/* ===== 新水固定值表（海鹽泡好後的典型 Ca/Mg/KH @35ppt，原廠典型值）=====
   PO4/NO3 海鹽本就≈0，不列入，換水推估時新水直接視為 0 */
const NEWWATER = {
  rss:  {Ca:440, Mg:1320, KH:8.0,  src:'Red Sea Salt 原廠典型值 @35ppt'},
  rscp: {Ca:490, Mg:1400, KH:11.0, src:'Red Sea Coral Pro 原廠手冊 @35ppt'},
  io:   {Ca:420, Mg:1320, KH:8.0,  src:'Instant Ocean 原廠典型值 @35ppt'},
  rc:   {Ca:500, Mg:1450, KH:12.0, src:'Reef Crystals 原廠典型值 @35ppt'},
  tmp:  {Ca:440, Mg:1300, KH:8.0,  src:'Tropic Marin Pro Reef 原廠典型值 @35ppt'},
  rpm:  {Ca:480, Mg:1450, KH:11.0, src:'Fritz RPM 原廠典型值 @35ppt'},
  av:   {Ca:450, Mg:1350, KH:9.0,  src:'aquavitro Salinity 原廠典型值 @35ppt'},
  bw:   {Ca:450, Mg:1350, KH:9.0,  src:'Brightwell NeoMarine 原廠典型值 @35ppt'},
};

/* ===== tab 切換 ===== */
const tabs=document.getElementById('tabs');
tabs.addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(!t)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.tabpane').forEach(x=>x.style.display='none');
  t.classList.add('on');
  document.getElementById(t.dataset.t).style.display='block';
});

/* ===== 數據紀錄 ===== */
const KEY='reef_log_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
document.getElementById('lDate').value=new Date().toISOString().slice(0,10);
let editIdx=null;  // 編輯中筆數索引（null=新增模式）
document.getElementById('logBtn').onclick=()=>{
  const rec={
    d:document.getElementById('lDate').value,
    temp:document.getElementById('lTemp').value,
    kh:document.getElementById('lKH').value,
    ca:document.getElementById('lCa').value,
    mg:document.getElementById('lMg').value,
    no3:document.getElementById('lNO3').value,
    po4:document.getElementById('lPO4').value,
    sg:document.getElementById('lSG').value,
    dripMode:document.getElementById('lDripMode').value,
    note:document.getElementById('lNote').value
  };
  const a=load();
  if(editIdx!==null){
    // 編輯模式：直接覆蓋原筆
    a[editIdx]=rec;
    editIdx=null;
    document.getElementById('logBtn').textContent='存一筆';
    document.getElementById('logCancel').style.display='none';
  }else{
    a.unshift(rec);
  }
  save(a);renderLog();
  ['lTemp','lKH','lCa','lMg','lNO3','lPO4','lSG','lDripMode','lNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('lDate').value=new Date().toISOString().slice(0,10);
};
document.getElementById('logCancel').onclick=()=>{
  editIdx=null;
  document.getElementById('logBtn').textContent='存一筆';
  document.getElementById('logCancel').style.display='none';
  ['lTemp','lKH','lCa','lMg','lNO3','lPO4','lSG','lDripMode','lNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('lDate').value=new Date().toISOString().slice(0,10);
};
function renderLog(){
  const a=load();const box=document.getElementById('logList');
  if(!a.length){box.innerHTML='<div class="hint">還沒紀錄～</div>';return;}
  box.innerHTML=a.map((r,i)=>{
    const cells=[['KH',r.kh],['Ca',r.ca],['Mg',r.mg],['NO3',r.no3],['PO4',r.po4],['sg',r.sg],['°C',r.temp],['La',r.la],['Vodka',r.vodka]]
      .filter(c=>c[1]).map(c=>`${c[0]}:${c[1]}`).join(' ｜ ');
    const dripCell=r.dripMode?`滴定:${r.dripMode}`.replace('_',' '):'';
    return `<div class="logitem"><span class="del" data-i="${i}">刪除</span>`+
      `<span class="edit" data-i="${i}">編輯</span>`+
      `<b>${r.d}</b> ${r.note?`· ${r.note}`:''}<br><span class="hint">${cells}${cells&&dripCell?' ｜ ':''}${dripCell}</span></div>`;
  }).join('');
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const arr=load();arr.splice(+b.dataset.i,1);save(arr);renderLog();
  });
  box.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{
    const arr=load();const r=arr[+b.dataset.i];if(!r)return;
    editIdx=+b.dataset.i;
    document.getElementById('lDate').value=r.d||'';
    document.getElementById('lTemp').value=r.temp||'';
    document.getElementById('lKH').value=r.kh||'';
    document.getElementById('lCa').value=r.ca||'';
    document.getElementById('lMg').value=r.mg||'';
    document.getElementById('lNO3').value=r.no3||'';
    document.getElementById('lPO4').value=r.po4||'';
    document.getElementById('lSG').value=r.sg||'';
    document.getElementById('lDripMode').value=r.dripMode||'';
    document.getElementById('lNote').value=r.note||'';
    document.getElementById('logBtn').textContent='更新這筆';
    document.getElementById('logCancel').style.display='inline-block';
    document.getElementById('lDate').scrollIntoView({behavior:'smooth',block:'center'});
  });
}
document.getElementById('expBtn').onclick=()=>{
  const a=load();if(!a.length){alert('沒有資料可匯出');return;}
  const head=['日期','水溫','KH','Ca','Mg','NO3','PO4_換水前','比重','滴定模式','備註'];
  const rows=a.map(r=>[r.d,r.temp,r.kh,r.ca,r.mg,r.no3,r.po4,r.sg,r.dripMode,r.note].join(','));
  const csv='\uFEFF'+head.join(',')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob);const a2=document.createElement('a');
  a2.href=u;a2.download='reef_log.csv';a2.click();URL.revokeObjectURL(u);
};
document.getElementById('clrBtn').onclick=()=>{
  if(confirm('確定清空全部紀錄？')){localStorage.removeItem(KEY);renderLog();}
};

/* 匯入 CSV（相容哥哥現有格式：date,time,kh,ca,mg,no3,po4,sg,dripMode,note） */
document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
document.getElementById('impFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const lines=rd.result.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length){alert('檔案是空的');return;}
    const head=lines[0].split(',').map(h=>h.trim());
    const idx=k=>head.findIndex(h=>h.toLowerCase()===k);
    const ci={date:idx('date'),time:idx('time'),kh:idx('kh'),ca:idx('ca'),mg:idx('mg'),
      no3:idx('no3'),po4:idx('po4'),sg:idx('sg'),dripMode:idx('滴定模式'),note:idx('note')};
    const get=(row,k)=>ci[k]>=0?(row[ci[k]]||'').trim():'';
    const rows=lines.slice(1).map(l=>l.split(','));
    const imported=rows.map(row=>{
      let d=get(row,'date');
      const t=get(row,'time');
      if(d && t) d=d+' '+t;       // 合併 date + time
      return {d, temp:'', kh:get(row,'kh'), ca:get(row,'ca'), mg:get(row,'mg'),
        no3:get(row,'no3'), po4:get(row,'po4'), sg:get(row,'sg'),
        dripMode:get(row,'滴定模式'), note:get(row,'note')};
    }).filter(r=>r.d||r.kh||r.ca||r.mg||r.no3||r.po4||r.sg||r.note);
    if(!imported.length){alert('沒有可匯入的資料列');return;}
    if(!confirm(`要匯入 ${imported.length} 筆紀錄嗎？\n（會加到現有列表前面，不會刪掉原有資料）`))return;
    const a=load();
    imported.reverse().forEach(r=>a.unshift(r));
    save(a);renderLog();
    alert(`✅ 匯入 ${imported.length} 筆成功！`);
  };
  rd.readAsText(f,'utf-8');
  e.target.value='';
};
renderLog();
</script>
</body>
</html>
