<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>E遊味盡·無極限 海報</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; display:flex; justify-content:center; padding:20px; }
  .poster {
    position:relative;
    width:1000px; height:1414px; overflow:hidden;
    background: radial-gradient(ellipse at 50% 34%, #1c0c34 0%, #0a0414 46%, #050505 100%);
    font-family:'Noto Sans TC', sans-serif;
  }

  /* ---- 科技感背景層 ---- */
  .layer { position:absolute; inset:0; }

  /* 細網格 */
  .grid-fine { z-index:0; opacity:.45;
    background-image: linear-gradient(rgba(0,243,255,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,243,255,.06) 1px, transparent 1px);
    background-size: 46px 46px; }

  /* 藍圖點陣 */
  .dot-mesh { z-index:0; opacity:.5;
    background-image: radial-gradient(rgba(0,243,255,.18) 1.4px, transparent 1.6px);
    background-size: 30px 30px; }

  /* 透視地板網格 (synthwave) */
  .grid-floor { z-index:0; bottom:0; top:auto; left:-60%; width:220%; height:62%;
    transform: perspective(440px) rotateX(74deg); transform-origin: bottom center;
    background-image: linear-gradient(rgba(0,243,255,.55) 2px, transparent 2px),
                      linear-gradient(90deg, rgba(188,19,254,.45) 2px, transparent 2px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to top, #000 8%, rgba(0,0,0,.35) 55%, transparent 92%);
            mask-image: linear-gradient(to top, #000 8%, rgba(0,0,0,.35) 55%, transparent 92%); }

  /* 透視天花板網格 (上方呼應) */
  .grid-ceil { z-index:0; top:0; bottom:auto; left:-60%; width:220%; height:40%;
    transform: perspective(440px) rotateX(-74deg); transform-origin: top center;
    background-image: linear-gradient(rgba(188,19,254,.4) 2px, transparent 2px),
                      linear-gradient(90deg, rgba(0,243,255,.4) 2px, transparent 2px);
    background-size: 64px 64px;
    -webkit-mask-image: linear-gradient(to bottom, #000 6%, rgba(0,0,0,.3) 55%, transparent 92%);
            mask-image: linear-gradient(to bottom, #000 6%, rgba(0,0,0,.3) 55%, transparent 92%); }

  /* 掃描線 */
  .scan { z-index:1; opacity:.5;
    background-image: repeating-linear-gradient(to bottom, rgba(0,243,255,.05) 0 1px, transparent 1px 4px); }

  /* 電路光跡 */
  .circuit { z-index:1; }
  .trace { position:absolute; height:2px; border-radius:2px;
    background:linear-gradient(90deg, transparent, rgba(0,243,255,.7), transparent);
    box-shadow:0 0 8px rgba(0,243,255,.5); }
  .trace.v { width:2px; height:auto; background:linear-gradient(180deg, transparent, rgba(188,19,254,.6), transparent);
    box-shadow:0 0 8px rgba(188,19,254,.4); }
  .node { position:absolute; width:9px; height:9px; border-radius:50%;
    background:#00f3ff; box-shadow:0 0 12px #00f3ff; }
  .node.p { background:#bc13fe; box-shadow:0 0 12px #bc13fe; }

  /* 光暈球 */
  .orb { position:absolute; border-radius:50%; filter:blur(60px); }
  .orb.a { width:420px; height:420px; left:-120px; top:120px; background:rgba(0,243,255,.22); }
  .orb.b { width:480px; height:480px; right:-140px; top:520px; background:rgba(188,19,254,.20); }
  .orb.c { width:360px; height:360px; left:300px; bottom:-120px; background:rgba(255,43,214,.16); }

  #stars { z-index:2; }
  .star { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; }

  /* ---- 內容 ---- */
  .title-wrap { position:absolute; top:104px; left:0; width:100%; text-align:center; z-index:6; }
  .top-logo { position:absolute; top:30px; left:18px; width:440px; height:auto; z-index:9;
    filter: drop-shadow(0 0 8px rgba(0,243,255,.55)); }
  .title { display:inline-block; font-weight:900; font-size:106px; letter-spacing:8px;
    background:linear-gradient(90deg,#00f3ff,#bc13fe);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 0 16px rgba(0,243,255,.5)); }
  .title-rule { width:430px; height:3px; margin:28px auto 0;
    background:linear-gradient(90deg, transparent, #00f3ff, #bc13fe, transparent);
    box-shadow:0 0 14px rgba(0,243,255,.6); border-radius:2px; }

  .qr-zone { position:absolute; top:39%; left:50%; transform:translate(-50%,-50%); z-index:6;
    width:580px; height:580px; display:flex; align-items:center; justify-content:center; }
  .qr-box { position:relative; width:560px; height:560px;
    display:flex; align-items:center; justify-content:center; }
  .qr-img { width:472px; height:472px; border-radius:16px; display:block;
    background:transparent; box-shadow:0 0 26px rgba(0,243,255,.35); }
  .corner { display:none; }

  /* 3C 裝飾圖案 不規則打散圍繞 QR */
  .deco { position:absolute; width:54px; height:54px; opacity:.9;
    filter: drop-shadow(0 0 6px currentColor); }
  .deco.cy { color:#00f3ff; } .deco.pu { color:#bc13fe; } .deco.pk { color:#ff2bd6; }
  .deco svg { width:100%; height:100%; display:block; }
  .deco.chip  { top:18px; left:64px; }
  .deco.gear  { top:46px; right:52px; }
  .deco.wifi  { top:140px; left:-14px; }
  .deco.batt  { top:150px; right:-22px; }
  .deco.sig   { bottom:150px; left:6px; }
  .deco.usb   { bottom:138px; right:-4px; }
  .deco.mon   { bottom:40px; left:86px; }
  .deco.pix   { bottom:26px; right:78px; }
  .deco.cir1  { top:248px; left:-34px; }
  .deco.cir2  { top:236px; right:-44px; }
  .deco.book  { top:-22px; left:236px; }
  .deco.phone { top:96px; right:-52px; }
  .deco.tablet{ top:104px; left:-52px; }
  .deco.laptop{ bottom:-22px; left:244px; }
  .px { position:absolute; width:7px; height:7px; border-radius:2px; background:#00f3ff;
    box-shadow:0 0 8px #00f3ff; opacity:.8; }
  .px.pu { background:#bc13fe; box-shadow:0 0 8px #bc13fe; }
  .px.pk { background:#ff2bd6; box-shadow:0 0 8px #ff2bd6; }
  .deco-field { position:absolute; inset:0; z-index:4; pointer-events:none; transform:translateY(-44px); }

  /* 頁尾：上方資訊 + 贊助商條 */
  .footer { position:absolute; left:0; bottom:48px; width:100%; z-index:6;
    display:flex; flex-direction:column; align-items:center; padding-bottom:22px; }
  .org-info, .activity-info { font-family:'Noto Sans TC',sans-serif; font-size:18px; line-height:1.85;
    color:#d7ecff; text-align:left; width:100%; padding:0 4px; letter-spacing:.5px;
    text-shadow:0 0 7px rgba(0,243,255,.28); }
  .activity-info { margin-bottom:8px; }
  .org-info { margin-bottom:14px; }
  .org-info .role, .activity-info .role { color:#00f3ff; font-weight:700;
    text-shadow:0 0 9px rgba(0,243,255,.6); }

  /* 頁尾上方：左資訊文字 + 右獎品並排 */
  .footer-top { display:flex; flex-direction:row; align-items:flex-start;
    justify-content:flex-start; gap:22px; padding:0 16px; }
  .info-block { flex:1; min-width:0; }

  /* 右上：獎品展示區（在資訊文字右側，3×3 九宮格，不擠壓左欄） */
  .prize-panel { width:300px; flex-shrink:0; z-index:6;
    display:flex; flex-direction:column; gap:8px; margin-top:-28px; }
  .prize-title { font-family:'Orbitron','Noto Sans TC',sans-serif; font-size:18px; font-weight:900;
    text-align:left; color:#ff2bd6; letter-spacing:2px; line-height:1.2;
    text-shadow:0 0 10px rgba(255,43,214,.8), 0 0 20px rgba(255,43,214,.4); }
  .prize-title small { display:inline-block; font-size:9px; color:#bc13fe; letter-spacing:3px; margin-left:8px;
    text-shadow:0 0 8px rgba(188,19,254,.6); }
  .prize-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .prize-cell { background:rgba(255,255,255,.04); border:1px solid rgba(255,43,214,.28);
    border-radius:8px; padding:4px; box-shadow:0 0 10px rgba(188,19,254,.18);
    transition:transform .25s ease, box-shadow .25s ease; }
  .prize-cell:hover { transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 16px rgba(255,43,214,.45); border-color:#ff2bd6; }
  .prize-cell img { width:100%; height:auto; border-radius:4px; display:block; }

  /* 贊助商 logo 條：左標籤 + 右 2 排，按大小排序 */
  .sponsors { position:relative; left:auto; bottom:auto; width:100%;
    display:flex; flex-direction:row; align-items:center; justify-content:center;
    gap:18px; padding:14px 40px 0;
    border-top:1px solid rgba(0,243,255,.16);
    box-shadow:0 -10px 30px -14px rgba(0,243,255,.25); }
  .sponsor-label { font-family:'Noto Sans TC','Orbitron',sans-serif;
    font-size:24px; font-weight:700; letter-spacing:2px; white-space:nowrap;
    color:#00f3ff; text-shadow:0 0 10px rgba(0,243,255,.8), 0 0 20px rgba(0,243,255,.4); }
  .sponsor-rows { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .sponsor-row { display:flex; flex-wrap:nowrap; justify-content:center;
    align-items:center; gap:20px; }
  .sponsors img { height:30px; width:auto; opacity:1;
    border:1px solid rgba(0,243,255,.30);
    border-radius:6px;
    padding:6px 12px;
    background:#fff;
    box-shadow:0 0 14px rgba(0,243,255,.18); }


  .info-zone { position:absolute; left:0; bottom:0; width:100%; height:25%; z-index:6;
    padding:0 72px; display:flex; flex-direction:column; justify-content:center; gap:26px; }
  .divider { width:100%; height:2px;
    background:linear-gradient(90deg, transparent, rgba(188,19,254,.7), transparent);
    box-shadow:0 0 10px rgba(188,19,254,.5); }
  .boxes { display:flex; gap:30px; justify-content:center; }
  .box { flex:1; height:124px; border:2px dashed rgba(0,243,255,.35); border-radius:14px;
    background:rgba(255,255,255,.012); box-shadow:inset 0 0 18px rgba(0,243,255,.08); }
</style>
</head>
