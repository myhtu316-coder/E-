<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E遊味盡‧無極限｜敬請期待</title>
  <style>
    :root {
      --teal: #0ea5a4;
      --teal-dark: #0c8a89;
      --coral: #ff7a59;
      --ink: #1f2937;
      --paper: #fefcf7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #e0f7f6 0%, #fefcf7 45%, #fff1ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow: hidden;
    }
    /* 漂浮書本裝飾 */
    .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .floaters span {
      position: absolute;
      font-size: 2rem;
      opacity: .25;
      animation: float 7s ease-in-out infinite;
    }
    .floaters span:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
    .floaters span:nth-child(2) { top: 22%; right: 10%; animation-delay: 1.2s; }
    .floaters span:nth-child(3) { bottom: 18%; left: 14%; animation-delay: 2.4s; }
    .floaters span:nth-child(4) { bottom: 12%; right: 16%; animation-delay: 3.6s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-18px) rotate(4deg); }
    }
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(14, 165, 164, .25);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(14, 165, 164, .18);
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2.4rem;
      line-height: 1.3;
      color: var(--teal-dark);
      margin-bottom: 10px;
      letter-spacing: .02em;
    }
    h1 .accent { color: var(--coral); }
    .sub {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .wait {
      font-size: 1.05rem;
      color: #6b7280;
      margin-bottom: 30px;
    }
    .wait .wave { display: inline-block; animation: wave 1.6s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(14deg); } 75% { transform: rotate(-8deg); } }
    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .unit {
      background: var(--teal);
      color: #fff;
      border-radius: 16px;
      padding: 14px 10px;
      min-width: 74px;
      box-shadow: 0 8px 18px rgba(14, 165, 164, .3);
    }
    .unit .num {
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .unit .lbl {
      font-size: .72rem;
      margin-top: 6px;
      opacity: .9;
      letter-spacing: .08em;
    }
    .date-pill {
      display: inline-block;
      font-size: .95rem;
      color: var(--coral);
      background: rgba(255, 122, 89, .12);
      padding: 8px 20px;
      border-radius: 999px;
      font-weight: 600;
    }
    @media (max-width: 420px) {
      h1 { font-size: 1.9rem; }
      .unit { min-width: 62px; padding: 12px 6px; }
      .unit .num { font-size: 1.5rem; }
      .countdown { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="floaters" aria-hidden="true">
    <span>📚</span><span>✨</span><span>📖</span><span>🌟</span>
  </div>

  <main class="card">
    <h1>E遊味盡<span class="accent">‧</span>無極限</h1>
    <p class="sub">活動 8 / 24 正式開始</p>
    <p class="wait">請耐心等候 <span class="wave">👋</span> ~</p>

    <div class="countdown" id="countdown" aria-live="polite">
      <div class="unit"><div class="num" id="d">--</div><div class="lbl">天</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lbl">時</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lbl">分</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lbl">秒</div></div>
    </div>

    <span class="date-pill">📅 2026 / 08 / 24 準時開跑</span>
  </main>

  <script>
    // 目標時間：台灣時間 2026-08-24 00:00:00 (UTC+8)
    const target = new Date('2026-08-24T00:00:00+08:00').getTime();
    const el = {
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
    };
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) {
        el.d.textContent = '0'; el.h.textContent = '00';
        el.m.textContent = '00'; el.s.textContent = '00';
        document.querySelector('.sub').textContent = '活動已經開始囉 🎉';
        document.querySelector('.wait').textContent = '歡迎來參加 ~';
        clearInterval(timer);
        return;
      }
      const day = Math.floor(diff / 86400000);
      const hr  = Math.floor((diff % 86400000) / 3600000);
      const min = Math.floor((diff % 3600000) / 60000);
      const sec = Math.floor((diff % 60000) / 1000);
      el.d.textContent = day;
      el.h.textContent = pad(hr);
      el.m.textContent = pad(min);
      el.s.textContent = pad(sec);
    }
    tick();
    const timer = setInterval(tick, 1000);
  </script>
</body>
</html>
